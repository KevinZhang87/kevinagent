server:
  host: 0.0.0.0
  port: 8000
  debug: false
  cors_origins:
  - http://localhost:3000
  - http://127.0.0.1:3000
database:
  type: sqlite
  sqlite_path: ./kevin.db
  pool_size: 5
  max_overflow: 10
  echo: false
agent:
  max_iterations: 30
  max_memory_items: 100
active_providers:
- deepseek
- mimo
memory:
  backend: sqlite
sandbox:
  enabled: true
  backend: auto
  workspace: ./sandbox_workspace
  docker_image: python:3.11-slim
  memory_limit: 512m
  cpu_limit: 1.0
  timeout: 60
  network_disabled: false
  max_file_size: 100000
  readonly_paths:
  - /etc
  - /sys
  - /proc
  - C:\Windows
  blocked_paths:
  - /etc/shadow
  - /etc/passwd
  - C:\Windows\System32
  blocked_commands:
  - rm -rf /
  - rm -rf /*
  - mkfs
  - dd if=
  - format
  - del /s /q C:\
  - ':(){ :|:& };:'
  - shutdown
  - reboot
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
