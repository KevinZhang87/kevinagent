providers:
  openai:
    name: OpenAI
    base_url: ''
    api_key_env: OPENAI_API_KEY
    models:
    - id: gpt-4o
      name: GPT-4o
      max_tokens: 4096
    - id: gpt-4o-mini
      name: GPT-4o Mini
      max_tokens: 4096
    - id: gpt-4-turbo
      name: GPT-4 Turbo
      max_tokens: 4096
    - id: o1-preview
      name: O1 Preview
      max_tokens: 4096
    - id: o1-mini
      name: O1 Mini
      max_tokens: 4096
  deepseek:
    name: DeepSeek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    models:
    - id: deepseek-v4-pro
      name: deepseek-v4-pro
      max_tokens: 4096
    - id: deepseek-v4-flash
      name: deepseek-v4-flash
      max_tokens: 4096
  moonshot:
    name: Moonshot (月之暗面)
    base_url: https://api.moonshot.cn/v1
    api_key_env: MOONSHOT_API_KEY
    models:
    - id: moonshot-v1-8k
      name: Moonshot V1 8K
      max_tokens: 4096
    - id: moonshot-v1-32k
      name: Moonshot V1 32K
      max_tokens: 4096
    - id: moonshot-v1-128k
      name: Moonshot V1 128K
      max_tokens: 4096
  glm:
    name: GLM (智谱)
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: GLM_API_KEY
    models:
    - id: glm-4
      name: GLM-4
      max_tokens: 4096
    - id: glm-4-flash
      name: GLM-4 Flash
      max_tokens: 4096
    - id: glm-4v
      name: GLM-4V
      max_tokens: 4096
  mimo:
    name: Xiaomi MiMo (小米)
    base_url: https://api.xiaomimimo.com/v1
    api_key_env: MIMO_API_KEY
    models:
    - id: mimo-v2.5-pro
      name: MiMo V2.5 Pro
      max_tokens: 4096
    - id: mimo-v2-pro
      name: MiMo V2 Pro
      max_tokens: 4096
  anthropic:
    name: Anthropic
    base_url: ''
    api_key_env: ANTHROPIC_API_KEY
    models:
    - id: claude-sonnet-4-20250514
      name: Claude Sonnet
      max_tokens: 4096
    - id: claude-haiku-4-5-20251001
      name: Claude Haiku
      max_tokens: 4096
    - id: claude-opus-4-20250514
      name: Claude Opus
      max_tokens: 4096
  ollama:
    name: Ollama (本地)
    base_url: http://localhost:11434
    api_key_env: null
    models:
    - id: llama3.1
      name: Llama 3.1
      max_tokens: 4096
    - id: qwen2.5
      name: Qwen 2.5
      max_tokens: 4096
    - id: mistral
      name: Mistral
      max_tokens: 4096
    - id: codellama
      name: Code Llama
      max_tokens: 4096
defaults:
  provider: deepseek
  model: deepseek-v4-flash
