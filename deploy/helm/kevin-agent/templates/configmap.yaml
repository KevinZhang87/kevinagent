apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kevin-agent.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kevin-agent.labels" . | nindent 4 }}
data:
  HOST: {{ .Values.config.host | quote }}
  PORT: {{ .Values.config.port | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  DEFAULT_PROVIDER: {{ .Values.config.defaultProvider | quote }}
  DEFAULT_MODEL: {{ .Values.config.defaultModel | quote }}
  MAX_ITERATIONS: {{ .Values.config.maxIterations | quote }}
  MAX_MEMORY_ITEMS: {{ .Values.config.maxMemoryItems | quote }}
  NEXT_PUBLIC_API_URL: "http://{{ include "kevin-agent.fullname" . }}-backend:{{ .Values.backend.service.port }}"
  NEXT_PUBLIC_WS_URL: "ws://{{ include "kevin-agent.fullname" . }}-backend:{{ .Values.backend.service.port }}"
