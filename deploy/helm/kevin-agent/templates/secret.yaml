apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kevin-agent.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kevin-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  MOONSHOT_API_KEY: {{ .Values.secrets.moonshotApiKey | quote }}
  GLM_API_KEY: {{ .Values.secrets.glmApiKey | quote }}
  MIMO_API_KEY: {{ .Values.secrets.mimoApiKey | quote }}
