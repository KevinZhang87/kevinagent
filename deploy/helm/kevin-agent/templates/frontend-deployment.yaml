apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kevin-agent.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kevin-agent.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kevin-agent.name" . }}-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "kevin-agent.frontend.labels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kevin-agent.fullname" . }}-config
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
