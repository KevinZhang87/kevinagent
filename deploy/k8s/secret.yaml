apiVersion: v1
kind: Secret
metadata:
  name: kevin-agent-secrets
  namespace: kevin-agent
  labels:
    app.kubernetes.io/name: kevin-agent
type: Opaque
stringData:
  # Base64 encode your API keys, or use:
  # echo -n "sk-xxx" | base64
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  MOONSHOT_API_KEY: ""
  GLM_API_KEY: ""
  MIMO_API_KEY: ""
  # For MySQL/PostgreSQL (uncomment and set)
  # DB_HOST: "localhost"
  # DB_PORT: "3306"
  # DB_NAME: "kevin_agent"
  # DB_USER: "root"
  # DB_PASSWORD: ""
