apiVersion: v1
kind: ConfigMap
metadata:
  name: kevin-agent-config
  namespace: kevin-agent
  labels:
    app.kubernetes.io/name: kevin-agent
data:
  # App config
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  # Database: sqlite | mysql | postgresql
  # For MySQL/PostgreSQL, set DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD in secret
  DATABASE_URL: "sqlite+aiosqlite:///./kevin.db"

  # Default model
  DEFAULT_PROVIDER: "openai"
  DEFAULT_MODEL: "gpt-4o"

  # Agent settings
  MAX_ITERATIONS: "30"
  MAX_MEMORY_ITEMS: "100"

  # Frontend API URL (internal K8s service)
  NEXT_PUBLIC_API_URL: "http://kevin-backend:8000"
  NEXT_PUBLIC_WS_URL: "ws://kevin-backend:8000"
